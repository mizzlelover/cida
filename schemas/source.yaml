# Source Registry Schema · 来源登记处
# 每一条理论/方法来源一条记录。文件位置：knowledge/sources/registry.yaml

source_id: ""          # src.<domain>.<slug>，如 src.rhetoric.chen-wangdao-fafan
title: ""              # 书名/篇名
author: ""             # 作者
year: null             # 年份（首版）
language: ""           # zh / en / ...
source_type: ""        # monograph / textbook / paper / course / article
domain: ""             # rhetoric / register / pragmatics / discourse /
                       # conversation / hosting / writing / international
authority: ""          # core / standard / supplementary / contested
access_status: ""      # full_text / key_chapters / review_only / metadata_only
url: ""
notes: ""              # 使用了哪些部分、证据等级、争议记录

# 规则：
# - 中文原生来源占比目标约 70%，国际补强约 30%
# - access_status 必须如实标注；综述/书评级证据不能支撑强断言
# - 冲突的来源并列保留，在 notes 记录分歧，不强行调和
