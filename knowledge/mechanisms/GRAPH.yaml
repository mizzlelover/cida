  - '**ANNOTATED 语料样本（2026-09-16 补，此前本节点无具体语料条目，仅有目录级说明）**：①**评论体·亲历来源**——白岩松《新闻1+1》20090616（`corpus.commentary.bai-20090616-death-penalty`，ANNOTATED）："其实我采访过当事人，因为当时是在昆明实行的"——把判断的证据位置明确标为**亲历采访**，随后才给细节（"当时是由法医院的院长来亲自注射的"）；②**演讲体·时间范围限定**——周轶君（`corpus.podcasts.ted-zhouyijun-2017`，ANNOTATED，原稿繁体、引用已作字形转换）："在
    11 年和 12 年的时候，我曾经有一段时间……产生了非常乐观的想法"→"但是坦白说这几年我迅速就失望了"——以**明示时间范围**为个人判断划界，不冒充长期规律；③**博客体·文本定位**——刘未鹏《快排为什么那么快》（`corpus.blogs.mindhacks-quicksort-so-quick`，ANNOTATED）："这篇文章相当于
    MacKay 原文的白话文版……后者在我看来并不是必须的"——先说明本文与原作的关系，再交代自己判断的边界。'
- id: mech.softening
  name: 缓和
  function: 调节异议、请求和不确定判断的社会距离
  file: knowledge/mechanisms/softening.md
  related:
  - uncertainty.md
  - concession.md
  - stance_system.md
  sources:
  - src.pragmatics.he-ziran; src.register.feng-shengli-gailun; corpus/interviews/
  - '**口语样本（2026-09-16 补）**：①**答问体·限定对象明确**——王辰（`corpus.interviews.bai-20200205-wangchen-cabin`，ANNOTATED）：对公众担忧先"这些担心有一定的道理"再限定（轻症患者的两个特点），对拐点则明确"无法预测"并列出四条件——**缓和的是"担忧的适用范围"，不是判断本身**，符合本节「缓和后必须仍能看出作者承担什么判断」；②**演讲体·给己方叙述加反向可能**——周轶君（`corpus.podcasts.ted-zhouyijun-2017`，ANNOTATED）："当然你不排除有时候我发现在他们身上也会有一些冲动或者是那种荣誉感而已"，避免把异国青年理想化。边界（重要）：两例均**未**把缓和用于安全或医疗警示——本节
    boundary_conditions 明令此类事项不得用礼貌缓和掩盖明确警示，答问体在"当天隔离""一定要临床实验"等处保持直陈。'
  - '**点评侧样本（2026-09-17 第三十六批补，样本追加，不改变 `validated` 结论）**：董卿·2019 主持人大赛'
  - 第六期点评（`corpus.hosting.named.dongqing-201912-commentary`，ANNOTATED；页内「董卿点评：」×6）——
  - '**先把评价权移交受众、再谈可改进处**："整体非常好，好的我就不说了，因为你们的好观众一定都看得很明白。'
  - 但是我觉得今天来到这里更多的是学习……"。与前两例合看，**缓和对象**再增一档：
  - ①对方的担忧范围（王辰）；②己方的叙述（周轶君）；③**受众的评判权**（董卿）。
  - 边界：该页为**第三方人工整理**（页内声明"本文来源于播音中国，由北京高考在线团队排版编辑"），
  - '**原视频语气未听校**；三例均**未**把缓和用于安全或医疗警示。'
- id: mech.stance_system
  name: 立场系统
  function: 让读者感到有一个具体的人在思考，并对思考负责
  file: knowledge/mechanisms/stance_system.md
  related:
  - reader_anticipation.md
  - rhetorical_peak.md
  sources:
  - '**官方致辞样本（2026-09-16 补）**：同条达沃斯致辞——**不点名对象指认**：全篇不出现对方国名，而以引号术语集合指认并反驳（"小圈子""新冷战""脱钩、断供、制裁"），并以"''有选择的多边主义''不应成为我们的选择"当场拒绝对方提法（术语回击）。属"立场表达可不依赖指名"的形态，与评论体（白岩松）直陈判断形成语域对照。'
  - '**同语域第二篇（2026-09-16 补）**：王毅联合国人权理事会讲话——①**显式抬高立场强度的标记**（"在此，我要强调的是"），把主张转为对机构的规范要求；②**不点名反对对象**（"反对打着人权幌子干涉别国内政、遏制别国发展"），与达沃斯篇的引号术语集指认同属"不指名"形态。'
  - '`src.conversation.ouzhitong-2024-jiushi-rentong`（**full_text**，2026-09-16，supplementary）：**立场表达功能**＝认同，并可**在同句中叠加埋怨／赞扬／附和**三种附加态度；人际互动功能＝建立"即时联盟"、依"求同准则"——为"立场不只表同意，还能叠评价色彩"补中文原生会话证据。'
  - 汉语立场表达研究（`knowledge/pragmatics/`；`src.pragmatics.ran-yongping` 冉永平《语用学：现象与分析》含人际交往原则/礼貌与面子章，review_only
    摘要级）
  - 何自然、冉永平语用学论著中的立场与预设研究
  - 白岩松、康辉评论语料的判断表达分析（`corpus/commentary/`，分析用）
  - Douglas Biber 的 stance 研究（补强）
  - Biber/Conrad 的语域与风格框架（`src.intl.biber-register`，review_only）补充“体裁变化不等于立场强度变化”的比较边界。
  - Toulmin 的论证分层与 Hyland 的元话语研究作为 review_only 外部参照（`src.intl.toulmin-uses-argument`、`src.intl.hyland-tse-metadiscourse`、`src.intl.hyland-jiang-metadiscourse`）；仍需中文语料与人工评测校准断言强度。
  - 精读样本：阮一峰周刊 406（假说归因标记"大概"）、阮一峰 ESSAY（让步转折+"提出问题不给答案"）、陈皓 22298（强判断+体裁局限声明）、云风《银河竞逐的乐趣和策略》（不利数字自证+问号自标不确定）——见
    `corpus/annotations/`
  - 口语立场样本（2026-09-16 补）：白岩松专访王辰（`corpus.interviews.bai-20200205-wangchen-cabin`，ANNOTATED，央视网官方实录
    12 轮问答直读）——受访者在"拐点"问题上明确"无法预测"并列出四项条件，判断强度随证据等级下调，反而使前面的强判断（方舱必要性）更可信；为 certainty
    分级在**口语**语域的运作提供中文原生实例（结构与措辞层，副语言层仍待听校）。
  - 口语立场样本·主持侧（2026-09-16 补）：《新闻1+1》20130730（`corpus.hosting.named.baiyansong-20130730-violence`，ANNOTATED，央视网官方实录直读）——主持人以**自我披露承担论证**：讲亲历的辱骂事件，收在"没有任何愤怒，而是感觉到巨大的悲凉"，随即回到判断（"这仅仅是一种道德问题吗"）；属本节
    personal「个人经验作为证据的合法来源」的正例，且披露后不滞留于抒情。与上一条（作答方）构成口语语域内的**提问方／作答方**两类角色样本。
  - '**访谈语域补样（2026-09-16 补，样本追加，不改变 `validated` 结论）**：崔永元专访（`corpus.hosting.named.cuiyongyuan-201806-tax`，ANNOTATED）——**立场权限与身份绑定**：把"能不能曝光、怎么曝光"的权力显式挂在自己的身份变化上（"以前是中央电视台主持人的时候，不可以，现在我就是孩子他爸"），并以"你也不用道德绑架我"划出他人无权要求的位置；同页还有**拒绝正面命名**（"别天天推我当什么民族脊梁、人民英雄"）——属"作者在场方式与浓度"的身份维度实现。边界：页面为第三方媒体转载＋采访方整理，原微博引文原页未核验；涉及在世个人争议事件，**引用最小化**。'
- id: mech.story_entry_exit
  name: 故事进出
  function: 用叙事经验建立连接，再安全回到论证主线
  file: knowledge/mechanisms/story_entry_exit.md
  related:
  - concrete_example.md
  - narrative_arc.md
  - topic_return.md
  sources:
  - src.writing.qishier-tang; src.hosting.yao-xishuang-boyin-fengge; src.intl.labov-narrative;
    corpus/podcasts/
  - '**口语样本（2026-09-16 补，此前仅 corpus/podcasts 泛指）**：①**完整进出链**——周轶君（`corpus.podcasts.ted-zhouyijun-2017`，ANNOTATED，TED
    官方中文稿直读）：埃及方杨树一段＝场景锚定（开罗沿途看到方形黄杨）→ 冲突或发现（同行者判断"太丑""太落后"，讲者拒绝该判断）→ 选择性细节（拿破仑 1798
    年带去科学家与园艺学家）→ **机制命名**（"如果你对一棵树有好奇心的话，一直追问下去，你也可以发掘一大段历史"）→ 回到主题（视角转换）；②**叙事出口落到规则**——加沙日本青年一段出口是"当你们开始看见别人的时候，这就是你的一个大进步"，把见闻转成判断而非感想。两例均满足本节
    repair_strategy「故事后说明它说明什么」；边界：私人经历不自动代表公共规律（本节 boundary_conditions），条目 `counterexamples`
    已记"跨文化议题不能只靠个人旅行经验代表整体"。'
  - '**第三位表达者（2026-09-16 补）**：陈晓卿（`corpus.podcasts.ted-chenxiaoqing-2020`，ANNOTATED，TED
    官方中文稿直读）——①**自嘲式入口**：开场"几乎我是不配拥有姓名的"→《舌尖上的中国》播出后在成都餐厅被食客认出（"难道成都不配拥有姓名吗？"）；②**出口转职业判断**：张爷爷一段不煽情收尾，而是转到"我们导演说他好像替老人过了整整一辈子"。'
- id: mech.summary
  name: 阶段收拢
  function: 在认知节点把已知信息压成可继续使用的判断
  file: knowledge/mechanisms/summary.md
  related:
  - restatement.md
  - closure.md
  - reader_anticipation.md
  sources:
  - src.discourse.xu-jiujiu-pianzhang; src.writing.xinwen-xiezuo; corpus/interviews/
  - '**口语样本（2026-09-16 补，此前仅泛指 corpus/interviews）**：①**访谈主持复述共识**——王辰专访（`corpus.interviews.bai-20200205-wangchen-cabin`，ANNOTATED）中主持以"是否朝着''应收尽收，应治尽治''的方向前行了"复述上一轮判据，把已获信息压成可继续追问的判断，**不引入新论据**（符合本节
    mechanism）；②**演讲的阶段性回检**——周轶君（`corpus.podcasts.ted-zhouyijun-2017`，ANNOTATED）：由青花史段收在"原来你可以转换视角来看这样一个历史"，再由消费数据段收在"外面的世界不仅仅是一个非常大的免税商店"，每段一个回检句后接下一段，未使用"综上所述"式路牌（符合
    overuse_risk 警告）；结尾另以"回到我最初讲的"完成全篇收拢（与 `closure.md`、`topic_return.md` 交叉，此处只取阶段收拢功能）。'
  - '**第三位表达者（2026-09-16 补）**：陈晓卿（`corpus.podcasts.ted-chenxiaoqing-2020`，ANNOTATED，TED
    官方中文稿直读）——段末一句收拢推演："美食它不应该是小众的，它应该藏在大多数人的一日三餐里"；篇末以"从这些这么多共同的东西里边，我们能看到人类其实是一个大家庭"完成全篇收拢，**不引入新论据**。'
- id: mech.topic_opening
  name: 话题开场
  function: 在最短路径内建立读者与问题的关系
  file: knowledge/mechanisms/topic_opening.md
  related:
  - reader_anticipation.md
  - topic_progression.md
  - audience_design.md
  - feature_headline_opening.md
  sources:
  - '**关联补登（2026-09-16）**：本节点 `overuse_risk` 所述"每篇都用冲突、反常或悬念会形成模板开头"'
  - 正是反模式 `feature_headline_opening.md` 所记形态；该反模式此前**两侧都无登记**（机制未列、其文件亦未反指），
  - 属双向登记缺口。补登依据与核查见 `corpus/annotations/spotcheck-20260916h.md`。
  - src.discourse.xu-jiujiu-pianzhang; src.writing.xinwen-xiezuo; src.intl.aristotle-rhetoric;
    corpus/blogs/
  - '**官方致辞开场·称谓长度由场合决定（2026-09-17 第五十七批补，样本追加，不改变 `validated` 结论）**：两条外交部全文直读的 `prepared`
    致辞构成**同一体裁内的场合对照**——①**多边论坛长式**：丁薛祥·博鳌亚洲论坛 2025 年会开幕式（`corpus.speeches.ding-20250327-boao`，ANNOTATED）开场依次为"**三类''尊敬的''分列**（各国领导人／国际组织负责人／论坛理事）＋各位来宾＋女士们，先生们，朋友们"，随后**致意三段式**（对年会召开**热烈祝贺**／对嘉宾**诚挚欢迎**／对长期支持**衷心感谢**）；②**联大极简式**：韩正·第
    78 届联大一般性辩论（`corpus.speeches.han-20230921-un-general-debate`，ANNOTATED）开场仅"**主席先生，各位同事：**"一句，随后以**五个并列短语的问题清单**铺陈形势（安全严峻／复苏蹒跚／鸿沟拉大／灾害增多／秩序受挑战）再引出主张。→
    两条共同印证本页 repair_strategy「留下对象、问题、判断三者中至少两项」，并补一条**语域参数**：**同一体裁内，场合越正式、称谓越简**；**开场的信息量由"问题清单"承担，不由称谓承担**。**边界**：两条均为
    `prepared` 审定文本、**副语言层未听校**；该形态**不可当模板**（本节点 `overuse_risk` 已覆盖"同一开场反复使用即成模板开头"）。详档
    `corpus/annotations/speeches-deepread-20260917b.md`。'
  - '**口语样本（2026-09-16 补）**：①**演讲体·熟悉物反转**——周轶君（`corpus.podcasts.ted-zhouyijun-2017`，ANNOTATED）：引《青花瓷》歌词两句建立共同起点，随即以"其实青花根本就不是中国的东西"推翻常识，再用"不知道你们会作何感想"把认知落差交给听众；②**电子媒体·个案并置双问**——《新闻1+1》20130730（`corpus.hosting.named.baiyansong-20130730-violence`，ANNOTATED）：两起公共场合作案并置后连问"怎么样看待我们的治安所面临的挑战，怎么样看待这次的专项治理行动"，把"挑战"与"治理"分开框定。两例均在开场即给出**对象
    + 问题**两项，符合本节 repair_strategy；均属口语语域，书面体样本仍以 blogs 为主。'
  - '**评论体补充样本（2026-09-16）**：①**标题即对照**——《新闻1+1》20090616（`corpus.commentary.bai-20090616-death-penalty`，ANNOTATED）以"从''子弹''到''针头''的距离"为题，开场即以一项反直觉事实落点（"所有的死刑犯选择的都是注射死刑"），**标题承担开场的一半工作**；②**封闭设问开场**——《新闻1+1》20081009（`corpus.commentary.bai-20081009-nobel-science`，ANNOTATED）由主持人直接向观察员设问（"他到底跟中国有没有关系？"），把开放议题**一次收成可回答的封闭问题**。两例均满足本节
    repair_strategy「留下对象、问题、判断三者中至少两项」；边界：两期均为 `scripted` 完成台本，含撰导成分。'
  - '**文化节目开场·四件套（2026-09-17 第三十八批补，样本追加，不改变 `validated` 结论）**：康辉《平"语"近人》'
  - 第三集（`corpus.hosting.named.kanghui-201810-lichen`，ANNOTATED）与第十集（`corpus.hosting.named.kanghui-201810-decai`，
  - ANNOTATED）**同一装置互证**——开场依次为：**问好 → 自我介绍（"我是主持人康辉"）→ 欢迎现场高校同学 →
  - 以习语或自家用典点题 → 掌声引入思想解读人**（如第三集"德才兼备，以德为先""德不孤，必有邻"；
  - 第十集"致天下之治者在人才""功以才成，业由才广"）。→ 本页 `repair_strategy` 的三项在此**以固定分工交付**：
  - '**对象＝现场人群**（欢迎两校同学）、**问题＝本集主题**（点题）、**判断＝用典一句**（共识句），'
  - 故**开场即把"谁在场、讲什么、凭什么讲"一并交代**。边界：两条均 `scripted` 台本、**副语言层未听校**；
  - 该形态**不可当模板**（本节点 `overuse_risk` 已覆盖"同一开场反复使用即成模板开头"）。
  - '**文化节目开场·同节目第一集，形态扩为六件（2026-09-17 第四十三批补，样本追加，不改变 `validated` 结论）**：'
  - 康辉《平"语"近人》**第一集**（`corpus.hosting.named.kanghui-201810-weizheng`，ANNOTATED）——与第三／十集**同型**，
  - 但两处**多出**：①**报本集主题**（"这期节目的主题，就是'一枝一叶总关情'，为民，以人民为中心"）；
  - ②**主题三连设问**（"总书记有过哪些重要的论述？／那些用典体现着怎样的治国之道、文化精髓？／
  - 又是怎样身体力行、切实为百姓做实事的呢？"）。→ 即"四件套"实为**同节目内的稳定骨架**，
  - 集与集之间在**点题段**有增减；本节 `repair_strategy` 三项仍一次性交付（对象＝两校同学、问题＝主题＋三连设问、判断＝用典一句）。
  - 边界同上（`scripted` 台本、副语言层未听校、**不得当模板**）。详档 `corpus/annotations/named-hosting-deepread-20260917e.md`
    §2。
  - '**文化节目开场·流行语切入（2026-09-17 第四十三批补，样本追加，不改变 `validated` 结论）**：康辉《平"语"近人》'
  - '**第八集**（`corpus.hosting.named.kanghui-201810-qinxue`，ANNOTATED）——开场先以**网络流行语**拉平距离'
  - （"主要看气质"）→ 紧跟一句设问（"那什么样的气质是最好的气质呢？"）→ **让经典接住**（苏轼"腹有诗书气自华"）
  - → 报本集主题"学习"。→ 与同节目其他集的"用典直入"**不同型**：**先降门槛再立经典**；
  - 本节 `repair_strategy` 三项仍齐（对象＝两校同学、问题＝"什么是好气质"、判断＝诗句一句）。
  - 边界同上；详档 `corpus/annotations/named-hosting-deepread-20260917f.md` §2。
- id: mech.topic_progression
  name: 话题推进
  function: 让文章的话题链在表层自然流动、底层结构成立
  file: knowledge/mechanisms/topic_progression.md
  related:
