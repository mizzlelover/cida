- id: mech.question_framing
  name: 问题框定
  function: 把宽泛主题收束为可回答的表达任务
  file: knowledge/mechanisms/question_framing.md
  related:
  - topic_opening.md
  - reader_anticipation.md
  - coherence.md
  sources:
  - '**反例型语域边界（2026-09-16 补）**：习近平达沃斯议程特别致辞（`corpus.speeches.xi-20210125-davos-agenda`，ANNOTATED）**全篇零问句**——推进完全由"编号课题（四大课题）＋正负成对纲领（坚持
    X／不搞 Y ×4）＋排比（中国将继续… ×5）"承担。说明**问句不是推进的唯一装置**，官方致辞语域以"编号—对照"完成同样的导航功能；本机制的适用域以**书面与自媒体语域证据**为准。**本证据不改变
    `validated` 结论，仅登记语域边界。**'
  - '**第二位表达者旁证（2026-09-16 补）**：王毅联合国人权理事会第 55 届会议讲话（`corpus.speeches.wang-20240226-un-human-rights`，ANNOTATED）**同样全篇零问句**，推进靠"坚持
    X"四组 + 机构规范段 + 自述段。**两位不同发言者、不同会场、相隔三年，均为零问句**——说明"零问句"是**语域特征而非个人风格**，本机制的证据域以书面与自媒体语域为准。**仍未改动本节点任何
    confidence。**'
  - （**2026-09-17 更正**：把"两位发言者零问句"推成"**零问句是官方致辞的语域特征**"**过强**——第三十二批在同一语域内找到反例，见下条。）
  - '**同语域反例（2026-09-17 第三十二批补，**修正上一批的语域边界表述**）**：李强在世界经济论坛'
  - 2024 年年会开幕式上的特别致辞（`corpus.speeches.li-20240116-davos`，ANNOTATED，外交部官网全文直读）
  - '**全篇含 2 处真设问**——①「信任从何而来？」（由主题释义层切到依据层，问后随即自答"它首先建立在……"）；'
  - ②「对中国经济到底应该怎么看？」（由建议层切到经济说明层，并把抽象判断转成可感知画面：达沃斯看
  - 阿尔卑斯山须"把视野放宽、把目光投远"）。两处均为**段际切换**装置，非气氛修辞。
  - '**更正后的表述**：官方致辞**不把问句当作主要推进装置**（导航主要由编号／排比／对照承担），'
  - '**但不排除以设问作段际切换**；问句判定仍按**"每问是否承担推进功能"**，不按数量、也不对语域一刀切。'
  - '**本节点 `confidence` 不变（仍 `validated`）**：本条修正的是**语域边界表述**，不是机制本身。'
  - 详档 `corpus/annotations/speeches-deepread-20260917.md` §4.1。
  - '**评论语域第三次补样（2026-09-17 第三十三批补，样本追加，不改变 `validated` 结论）**：'
  - 《新闻1+1》20090910（`corpus.commentary.bai-20090910-substitute-teachers`，ANNOTATED，
  - '**五页并查约 10,487 汉字**）——三处用法：①**开场把身份困境框成选择问**（"到底是去还是留就成了一个问题"），'
  - 使后续政策讨论有明确的对照轴；②**中段自问自答承担论证推进**（"这个大的方向对不对？当然对。对在哪儿呢？"
  - → 随即给三点现实条件）；③**结尾用两个未解问题收束**（"那 24 万究竟有多大比例转成了公办教师"、
  - '"没有转成公办教师的代课教师现在的日子又怎么样？"），**不封口、不升格为号召**。另：同族条目 `corpus.commentary.bai-20081209-civil-service-parttime`'
  - 此前登记"第 3 页不可得、收束方式未核"，第三十三批已补齐（`108759_2.shtml`，3,049 汉字），
  - 该条的问句分层（开场五连问→标题立意自问→"支三招"前的过渡问）**现全篇可核**。三例均为**台本**，
  - '**不构成即兴追问证据**。'
  - '**对谈体补样（2026-09-17 第三十五批补，样本追加，不改变 `validated` 结论）**：①余华×张旭东对谈'
  - （`corpus.interviews.cw-20260730-yuhua-zhangxudong`，ANNOTATED，中国作家网转载页直读）——
  - '**提问以"阶段性主问题"划分小节且自带回答边界**（"你能不能从文学的角度谈谈文学和时代的关系？"、'
  - '"我想请你谈谈《活着》在你整个创作中的位置、功能和内部张力"），并**以受访者原话为追问锚**'
  - （直接引用其序言中"高尚"一词再问"怎么理解它"）——追问落在**用词**上，回答因此必须给出定义；
  - ②路内×小白对谈（`corpus.interviews.cw-20260707-lunei-xiaobai`，ANNOTATED）——**回指式追问**
  - （以对方前文关键词"消耗"重启话题），使追问与前文形成**可追溯的线**，而非另起一问。
  - '**新增边界条件**：这两条的**提问者本身是该话题的表达者**（研究者／同行），问题内嵌其自己的判断与做法，'
  - 与机构问答（主持/记者**取证式**提问）**不可混算**；两条均为转载页整理稿，**副语言层未听校**。
  - '**方法自述侧补样（2026-09-17 第三十七批补，样本追加，不改变 `validated` 结论）**：柴静·新浪嘉宾访谈'
  - （`corpus.hosting.named.chaijing-200803-style`，ANNOTATED，**三页并查正文 ≈8,545 汉字**）——
  - ①**定位先于问法**："我是《新闻调查》的记者，我一直在做深度的调查性报道"，据此推出"不仅要在现场，
  - 而且要调查和追问"；②**提问数量约束 + 三级筛选**：自定"在五米的距离中问三到五个问题"，按
  - '"最核心的信息是什么／公众的未知是什么／在这个未知中还有哪些可能对这个发布信息造成疑问的事情"三层筛；'
  - ③**对"犀利提问"的自我修正**（忘我／不刻意让对方难堪／良性传达价值），并以**华南虎案例**复盘改问法
  - （由"你是局长你还不知道吗"改为"国际上有这么几个条件，您现在知道了，您怎么理解"）。
  - '**新增边界**：该条为**主持人方法自述**（事后主张），**不是主持实录**，其"装置"可登记，'
  - '**不得**与现场问答的结构证据混算，也不可据此主张执行率。'
  - src.discourse.xu-jiujiu-pianzhang; src.pragmatics.he-ziran; `corpus/interviews/`
  - 命名主持人分段样本：王志（水均益、柴静、鲁健、窦文涛、杨澜）`corpus/hosting/` 下的 `named-*` 条目，仅用于问题任务与边界的跨来源比较
  - Austin 的言语行为分层（`src.intl.austin-speech-acts`，review_only）提示先区分命题内容与当前表达动作；不能将讲义级概述直接当作中文问句规则。
  - Searle 的言语行为章节（`src.intl.searle-speech-acts`，review_only）补充“表达形式与行动条件”的问题边界；不把英语分类直接套入中文问答。
  - 刘娅琼、陶红印《汉语谈话中否定反问句的事理立场功能及类型》（`src.conversation.liuyaqiong-2011-fanwen`，review_only，摘要级）：会话证据显示否定反问句表达负面事理立场（提醒/意外/反对/斥责四层级）而非询问——为"真问句
    vs Fake Hook"与"反问承担立场"的判定边界提供中文原生依据；摘要级不外推为全文结论。
  - 和菜头《抒情的基础》精读（`corpus/blogs/hecaitou_the-groundwork-for-romance.yaml`，ANNOTATED，2026-09-11）：第四位表达者样本——1500
    字随笔含 10 个问句（四作者最高档），每个问句均承担真实转轴功能（设问转轴/情境反问/归谬反问/预答辩反问），无 Fake Hook；与阮一峰 ESSAY（1.8
    问/篇）对照说明问句密度与文体可靠性可解耦，判据是"每问是否承担推进功能"而非数量。
  - '**政务门户在线访谈·两型提问装置（2026-09-17 第六十三批补，样本追加，不改变 `validated` 结论）**：'
  - ①**主持代网民问、编号呈现**——广德市医保局在线访谈（`corpus.interviews.guangde-20231213-medical-insurance`，ANNOTATED，**实录正文约
    2,387 汉字**）：
  - 问题以"**问一／问二…**"编号，**文本无署名**（属**编辑过的问答**），答方以"**答N（职务）**"署名；
  - 问序按"**好处→材料→流程→待遇**"推进，**由浅入深、先易后难**。
  - ②**网民具名提问、单嘉宾逐条答**——深圳市医保局在线访谈（`corpus.interviews.shenzhen-20231030-medical-insurance`，ANNOTATED，**实录正文约
    2,445 汉字**）：
  - 页内可核 **11 位具名网友昵称**（"梦中的旅者""吟游诗人"…）**各自设问**，答方标签固定（"【单友亮同志】"），
  - '**一问一答极短**（部分答仅一两句）。'
  - → **本节点新增的边界**：这两条的**提问者不是采访方／对谈方／媒体方，而是受众（网民）本身**
  - （广德为**主持代问**、深圳为**昵称具名**），故"问句承担推进"的判定在此**由提问装置（代问／具名）决定问题文本**，
  - 与机构问答（主持/记者**取证式**提问）**不可混算**；两条均为**官方书面实录**，**副语言层不可得**。
  - 详档 `corpus/annotations/interviews-deepread-20260917b.md`。
  - '**评论语域补样（2026-09-16 补，样本追加，不改变 `validated` 结论）**：①《新闻1+1》20081209（`corpus.commentary.bai-20081209-civil-service-parttime`，ANNOTATED）——主持人开场**五个连问各对应一条政策疑点**（"作为纳税人你会想什么？……他的本职工作怎么办？人家请他去兼职，图什么？"），把抽象条款翻成公众可问的问题；②《新闻1+1》20190421（`corpus.commentary.bai-20190421-yuanfu`，ANNOTATED）——评论段四问（"会建这么超规模的中心吗／这么大的投入怎么收费／能持平吗／园林是不是太大了"）**逐项挂在已列出的具体事实上**。两例均为"问句承担推进而非气氛"的正例。边界：均为
    `scripted` 台本，**不构成即兴追问证据**。'
- id: mech.reader_address
  name: 读者指向
  function: 把读者的注意力和疑问纳入表达设计
  file: knowledge/mechanisms/reader_address.md
  related:
  - reader_anticipation.md
  - audience_design.md
  - discourse_markers.md
  - fake_intimacy.md
  sources:
  - '**关联补登（2026-09-16）**：本节点 `overuse_risk` 所述"每段设问、每段呼唤读者会显出模板感和讨好"'
  - 即反模式 `fake_intimacy.md` 的机制侧描述；该反模式此前**两侧都无登记**，属双向登记缺口。
  - 补登依据与核查见 `corpus/annotations/spotcheck-20260916h.md`。
  - src.conversation.hudong-lilun-fangfa; src.pragmatics.he-ziran; corpus/interviews/
  - '**口语样本（2026-09-16 补）**：周轶君（`corpus.podcasts.ted-zhouyijun-2017`，ANNOTATED，TED
    官方中文稿直读）——三处称呼**各有联合注意功能而非礼貌填充**：①开场"不知道你们会作何感想？"（把认知落差交给听众）；②中段"大家别误会，我不是说大家出国不要去买东西"（预防性排除误读）；③结尾"更多的希望我觉得是在在座的每一位"（把结论转交听众）。可与书面样本对照：**演讲体的读者指向集中在两端（开场设疑、结尾转交）**，中段仅在误解概率最高处插入一处，未滑向
    overuse_risk 的"每段呼唤读者"。边界：TED 为 `scripted` 台本，含撰稿成分，不等同即兴口语。'
  - '**博客体样本（2026-09-16 补，补第二位表达者）**：刘未鹏《快排为什么那么快》（`corpus.blogs.mindhacks-quicksort-so-quick`，ANNOTATED）——**以人称引导
    + 顺读者疑问推进**："我们先来玩一个猜数字游戏：我心里默念一个 1~64 之间的数，**你来猜**（你只能问答案是''是''或''否''的问题）。……**你应该采取什么策略呢**？"，随后自答"很显然，二分"；紧接着再补一问"**为什么这种策略具有最优下界**？答案也很简单，这个策略是平衡的"——两处设问都**紧跟答案**，属本页「在高概率疑问处给回应」，非修辞性设问。'
