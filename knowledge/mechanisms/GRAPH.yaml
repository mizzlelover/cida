  - Hyland/Tse 的作者—读者互动层与 Toulmin 的限定词层（`src.intl.hyland-tse-metadiscourse`、`src.intl.toulmin-uses-argument`，review_only）补充“证据位置先于语气强度”的候选框架。
- id: mech.softening
