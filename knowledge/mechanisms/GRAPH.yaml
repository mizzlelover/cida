- id: mech.rhetorical_peak
  name: 修辞峰值
  function: 让全篇最值得记住的判断，获得最强的语言形式
  file: knowledge/mechanisms/rhetorical_peak.md
  related:
  - compression.md
  sources:
  - 陈望道《修辞学发凡》（修辞与题旨情境的适配原则）
  - 刘勰《文心雕龙·隐秀》（`src.rhetoric.liu-xie-wenxin`，key_chapters；“秀”是局部突出，不是全文装饰化）
  - 董卿《主持人大赛》点评语料的功能分析（Abstract & Elevate 的位置规律，见 `corpus/hosting/`）
  - Aristotle《修辞学》第三卷（`src.intl.aristotle-rhetoric`，key_chapters；清楚与合宜优先，隐喻和节奏须服从语体与主题）
  - 阮一峰周刊 406、ESSAY《站在未来的十字路口》与陈皓 22298、22341 精读样本
  - （`corpus/annotations/`，VALIDATED×2 + ANNOTATED×2；排版峰值/意象峰值/加粗小结的体裁变体）
  - 和菜头《抒情的基础》精读（`corpus/blogs/hecaitou_the-groundwork-for-romance.yaml`，ANNOTATED，2026-09-11）：
  - 中段归位峰值（"这就是我说的基础……"）+ **元语言收尾**（"省脑子就会导致费钱，句号。"
  - ——口说"句号"同时完成收束标记、去端着与压缩）；金句稀缺性由形式克制保证。
  - '> 勘误（2026-09-10）：本页旧版曾列"和菜头《槽边往事》修辞密度抽样"；'
  - '> 经查 `corpus/blogs/` 无和菜头条目（采集期网络不可达），该引用无佐证，已删除。'
  - '> **闭环（2026-09-11）**：和菜头条目已实际取得（hecaitou.com 通道恢复），'
  - '> 上述引用为有据登记；旧版引用以本轮实际精读为准。'
- id: mech.rhythm
  name: 节奏
  function: 让句子的长短呼吸由意义推动，而不是随机分布
  file: knowledge/mechanisms/rhythm.md
  related:
  - compression.md
  sources:
  - 现代汉语句式的节奏研究（`knowledge/rhetoric/`）
  - 王希杰《修辞学通论》（句式的选择与调整）
  - 余光中《怎样改进英式中文》（中文弹性句法 vs 西式长句）
  - 和菜头、阮一峰文本的句长抽样对比（`corpus/blogs/`，分析用）
  - 刘勰《文心雕龙·情采》《隐秀》（`src.rhetoric.liu-xie-wenxin`，key_chapters；内容先于装饰，峰值稀缺，古典命题不直接外推）
  - Aristotle《修辞学》第三卷相关章节（`src.intl.aristotle-rhetoric`，key_chapters；清楚、合宜、自然且有节制的散文节奏）
  - Stivers 等的跨文化话轮研究与 Gumperz 的语境线索研究（`src.intl.stivers-turntaking`、`src.intl.gumperz-contextualization`，review_only）；只作“节奏依受众和语境而变”的边界证据，不设统一停顿秒数。
  - Biber/Conrad 的语域比较与 Tannen 的会话风格页（`src.intl.biber-register`、`src.intl.tannen-conversational`，review_only）提醒节奏参数须随体裁、互动关系和受众迁移，不把英语语域统计当中文目标值。
  - 阮一峰《站在未来的十字路口》与陈皓《感染新冠的经历》精读样本
  - （`corpus/annotations/ruanyifeng-essay-survivor-preface-20260910.md`、
  - '`corpus/annotations/coolshell-22341-20260910.md`，均 ANNOTATED）'
- id: mech.self_positioning
