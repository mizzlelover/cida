    取得摘要）：以会话分析方法对"就是（说）"在自然话语中的**位置**及话语功能作个案分析并揭示语法化路径——与姚双云 2012（功能三分）、史金生 2013（语篇组织机制）构成同一标记的第三种分类视角，且其三篇互不相同；摘要级不外推。'
  - '`src.conversation.houruifen-2009-bieshuo` 侯瑞芬《"别说"与"别提"》（review_only，摘要级，2026-09-16
    取得摘要，《中国语文》）：共时多种用法并存源于动词短语的词汇化与语法化，语义演变与会话中"质"原则、"量"原则密切相关，语用推理与听说互动是关键——为"话语标记来源须区分真值/非真值"提供「别说」系列的中文原生证据。'
  - '`src.conversation.yinhailiang-2009-bieshuo` 尹海良《自然口语中的话语标记"别说"》（review_only，摘要级，2026-09-16
    取得摘要）：常居**话轮开头或中间**，四功能（肯定-确认/否定-标异/标异-提醒/引发-阐释），核心义为"确认"（认知倾向一致）与"标异"（不一致），语法化于"不用说"义——补"功能须绑定话轮位置"这一可检验判据。'
  - '`src.conversation.ouzhitong-2024-jiushi-rentong` 欧芝同、谭方方《互动视角下认同标记"就是"的功能考察》（**full_text**，2026-09-16
