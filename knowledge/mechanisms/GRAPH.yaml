  - '`src.conversation.lixinyue-2024-jiushi-yihuan` 李馨悦、谭方方《急诊科医患会话话语标记"就是(说)"的语用分析》（**full_text**，2026-09-16
    PDF 全文实读；supplementary）：真实医患会话中"就是(说)"的**话题组织四功能＝设立／延续／切换／拉回话题**，加形式连贯三式（引发／转接／占据话轮）——把"同一标记可作用于话题全周期"写成可核验清单。'
  - '`src.conversation.lihongyu-huashizheme` 李宏宇《话语标记"话是这么说"语用功能探析》'
