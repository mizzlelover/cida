  - '**口语样本（2026-09-16 补，此前仅 blogs 一处）**：**答问体·以分类消解模糊概念**——王辰（`corpus.interviews.bai-20200205-wangchen-cabin`，ANNOTATED，央视网官方实录直读）：主持人问"疑似病例是否也找到了有效的办法"，回答先给制度（疑似病例要求当天隔离），再把"疑似病例"劈出一类——"临床诊断病例，也就是在流行病学史和临床表现上和确诊病例高度吻合"；另在检测处用"需要指出的是"先纠正常见误读（并非所有患病者都能检出核酸阳性，检出率约
    30%–50%），再落到建议。两处都在**第一次影响判断的位置**补最小必要信息，符合本节 mechanism；边界：医学概念须保留正式定义（见 boundary_conditions），本文只取澄清手法。'
  - '**主持侧澄清样本（2026-09-16）**：《新闻1+1》20090616（`corpus.commentary.bai-20090616-death-penalty`，ANNOTATED，央视网实录直读）——最后一轮由**主持人**先把事实校准再作答："12
    年这两种死刑方式一直在并行地推进的话，**选择的不是说是犯人去选择，而是说由执行的这个单位去选择**"；观察员随后据此展开（1997 年《刑诉法》第 212
    条"枪决或者注射等方式"）。此前本节点的口语样本为**答问体专家侧**（王辰以分类消解"疑似病例"），此处补上**主持侧**：澄清发生在主持人手里，作用是**先消除一个流行误解，再让解释有落点**。'
- id: mech.closure
  name: 结尾收束
  function: 让文本完成一次判断、行动或视角回返
  file: knowledge/mechanisms/closure.md
  related:
