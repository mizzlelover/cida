  sources:
  - '**官方致辞样本（2026-09-16 补）**：同条达沃斯致辞——**首尾同象**形态：标题意象"火炬"全篇只在标题与篇末出现两次，篇末原文重现"让多边主义火炬照亮人类前行之路"，中间不再出现；收束前先以三连"任何…最终都必然归于失败！"置峰值，再以"携起手来"归位。'
  - '**同语域第二篇（2026-09-16 补）**：王毅联合国人权理事会讲话——**同题回环（无标题意象）**形态：开篇立"保护和促进人权是全人类的共同事业"，篇末回到"为世界人权事业健康发展做出新的贡献"；峰值由收尾短对偶"人权保障没有最好，只有更好"承担。'
  - '**官方致辞收束·两种"不升华"形态（2026-09-17 第五十七批补，样本追加，不改变 `validated` 结论）**：①**回到场合本身**——丁薛祥·博鳌亚洲论坛
    2025（`corpus.speeches.ding-20250327-boao`，ANNOTATED）末段不拔高，先给一句对平台的**功能判断**（"博鳌亚洲论坛是开放包容、交流互鉴的重要国际平台"），再落到**祝愿**（"最后，预祝博鳌亚洲论坛2025年年会圆满成功！"）；②**"责任—担当—共同行动"三拍**——韩正·第
    78 届联大一般性辩论（`corpus.speeches.han-20230921-un-general-debate`，ANNOTATED）末段"中国将矢志不渝推动构建人类命运共同体，**为大国使命尽责，为人类前途担当**。中国愿同……国家**携手同行、和衷共济**，共同开创世界更加美好的未来"。→
    两条共同印证本页 repair_strategy「删除没有来源的宏大收尾，改为可验证的行动」：**首条把收尾还给"场合功能"，次条把收尾还给"己方角色＋共同动作"**，**均未引入前文无法支撑的新信息**；可作
    `overuse_risk`（强行升华）的**官方语域对照正例**。**边界**：两条均为 `prepared` 审定文本、**副语言层未听校**；"三拍"句式**不可当模板套用**（同一句式反复即成本页
    `overuse_risk` 所指的升华模板）。详档 `corpus/annotations/speeches-deepread-20260917b.md`。'
  - '**"以现成短句收束"（2026-09-17 第六十四批补，样本追加，不改变 `validated` 结论）**：两条官方定稿致辞——'
  - ①陈晓东·博鳌亚洲论坛 2024（`corpus.speeches.chen-20240328-global-security`，ANNOTATED，**正文约
    3,696 汉字**）
  - 末段以**会议所在地的现成谚语**起收（"**中国海南有谚语道：'众人齐心，黄土变金。'**"），
  - 随后一句**判断句**（"全球安全倡议**是中国的，也是世界的**"）＋祝愿；
  - ②刘彬·人工智能全球治理高级别会议 2026（`corpus.speeches.liu-20260718-ai-governance`，ANNOTATED，
  - '**正文约 1,101 汉字**）末段以**文言对句**起收（"**孤举者难起，众行者易趋。**"），随后接倡议与欢迎。'
  - → 与既有样本的关系：前例分别落在**首尾同象**（火炬）／**同题回环**（人权）／**回到场合功能**（博鳌）／
  - '**角色移交**（经典诵读）；本条**追加"以现成短句收束"这一形态**——**借一句已有的熟语把"记住"这一步'
  - 替读者完成**，比自造总结句更省力。**边界**：两句均为**中文现成表达**，**不等于自造格言**；
  - 且**熟语不可当模板反复套用**（即本页 `overuse_risk` 所指的升华模板）。详档
  - '`corpus/annotations/speeches-deepread-20260917c.md`。'
  - src.writing.ma-shaohua-pinglun; src.rhetoric.chen-wangdao-fafan; src.rhetoric.lunyu;
    src.intl.aristotle-rhetoric; src.intl.schegloff-sacks-closings; corpus/blogs/
  - '**"微行为收束"正例（2026-09-16 补）**：《新闻1+1》20130730 结尾（`corpus.hosting.named.baiyansong-20130730-violence`，ANNOTATED，央视网官方实录直读）——把一个抽象的社会呼吁折算成**一次可想象的动作延迟**："全社会强调了这样的一种谴责，可能他就会犹豫三四秒，就不会举起那个两岁的女童了，安全就会多一点。"该收束不拔高、不祝愿，而是给出可被前文支撑的最小行为变化，与本节
    repair_strategy「删除没有来源的宏大收尾，改为可验证的行动」相符；可作为 `overuse_risk`（强行升华）的直接对照正例。边界：节目为
    `scripted` 类型，含撰稿成分，不可全归为主持即时立场。'
  - '**文化节目收束·角色移交（2026-09-17 第三十八批补，样本追加，不改变 `validated` 结论）**：康辉《平"语"近人》'
  - 第三集（`corpus.hosting.named.kanghui-201810-lichen`，ANNOTATED）与第十集（`corpus.hosting.named.kanghui-201810-decai`，
  - ANNOTATED）——两集**同一装置互证**：末段均为「**经典诵读环节**」，由**专职诵读角色**念典籍节选收束
  - （第三集念《爱莲说》节选"中通外直，不蔓不枝，香远益清，亭亭净植，可远观而不可亵玩焉"；
  - 第十集由「经典诵读人于芳」念《资治通鉴》节选·司马光与《管子》节选），**主持人不再作总结陈词**。
  - → 与前三条**关键差异**：**收束不由表达者本人完成，而移交给一个专门角色**；同时满足本页 repair_strategy
  - 「不引入前文无法支撑的新信息」——典籍原文在前文已被引述，末段只**原样复现**，不是新增主张。
  - 边界：两条均 `scripted` 台本、**副语言层未听校**；且为**同一节目两集**，只据其登记装置。
  - '**同节目内的反例/变体（2026-09-17 第四十三批补，重要边界）**：康辉《平"语"近人》**第八集**'
  - （`corpus.hosting.named.kanghui-201810-qinxue`，ANNOTATED，`curl` 200／134,446 B／汉字
    9,207）——
  - '**同一位主持人、同一节目**，末段却**先作价值陈述式总结**（"我们的青年要上进……那就必须大兴学习之风"）'
  - '**再**移交「经典诵读环节」（「经典诵读人李丹丹」念苏轼《和董传留别》、袁枚《续诗品》、辛弃疾《青玉案·元夕》）。'
  - → **本条对上一条的校正**：第三／十集的"角色移交＋主持人**无**总结陈词"**不是该节目的固定格式**——
  - '**同一节目内收束形态并不唯一**，**不得据单集外推**。就本节 discipline 看，两者**都成立**：'
  - 价值陈述部分仍落在前文已论证的主题上（未引入新信息），诵读环节仍**原样复现**前文所引典籍。
  - 边界同上（`scripted`、副语言层未听校）；详档 `corpus/annotations/named-hosting-deepread-20260917f.md`
    §2。
  - '**第四十四批再补三集（第二集 `zhiguo`、第七集 `shigan`、第九集 `liyou`）**：该节目**已验证 7 集**——'
  - '**第一／三／十集"主持人无总结陈词"，第二／七／八／九集"先作价值陈述式总结再移交诵读"**，'
  - 即"有／无总结"**在同一节目、同一主持人间并存**；详档 `corpus/annotations/named-hosting-deepread-20260917g.md`
    §5。
  - '**第四十五批把该节目**12 集全部核完**（第四集 `corpus.hosting.named.kanghui-201810-jiafeng`／'
  - 第六集 `corpus.hosting.named.kanghui-201810-xiushen`／第十一集 `corpus.hosting.named.kanghui-201810-zhiding`／
  - 第十二集 `corpus.hosting.named.kanghui-201810-youpeng` 升 `ANNOTATED`，
  - 另复测第五集 `corpus.hosting.named.kanghui-201810-pingyu` 末段）**——最终结果：**3 集"主持人无总结陈词"**（第一／三／十集）、
  - '**9 集"先作价值陈述式总结再移交诵读"**（第二／四／五／六／七／八／九／十一／十二集）**。'
  - → **结论（可复核）**：该节目的**收束形态以"先自陈再移交"为主（9/12）**，但**存在明确的少数形态（3/12 无自陈）**，
  - 故 **"有无总结"不是该节目的识别特征**；**任何据单集或少数几集的外推都不成立**。
  - 详档 `corpus/annotations/named-hosting-deepread-20260917h.md` §6（含各集末段短定位与读数）。
