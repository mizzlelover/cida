  - '`corpus/annotations/coolshell-22341-20260910.md`，均 ANNOTATED）'
  - '**可追溯性补写与勘误（2026-09-16）**：①样本补显式 `corpus_id`——`corpus.blogs.ruanyifeng-essay-survivor-preface`、`corpus.blogs.coolshell-22341`；②**勘误**：sources
    首行原列的 `corpus/podcasts/` **核对后无条目支撑本文本节点**——现有两条 `ANNOTATED` 播客（`corpus.podcasts.ted-zhouyijun-2017`、`corpus.podcasts.ted-chenxiaoqing-2020`）的产出节点为
