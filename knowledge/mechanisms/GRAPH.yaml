- id: mech.concrete_example
  name: 具体例证
  function: 让抽象判断可以被想象、检验和迁移
  file: knowledge/mechanisms/concrete_example.md
  related:
  - explanation.md
  - metaphor_analogy.md
  - narrative_arc.md
  sources:
  - src.writing.qishier-tang; src.discourse.xu-jiujiu-pianzhang; corpus/blogs/
  - '**口语样本（2026-09-16 补）**：周轶君（`corpus.podcasts.ted-zhouyijun-2017`，ANNOTATED，TED
    官方中文稿直读）——"埃及的杨树为什么都是方的？"一段呈现**追问式例证**的完整形态：观察异常 → 同行者给现成判断（"太丑了""太落后了"）→ 讲者拒绝该判断
    → 追问 → 在凡尔赛宫御花园获得远因 → 落到"1798 年拿破仑带去整套欧洲规范"的历史判断。与本节 mechanism「主张→例证→解释证据关系→边界」一致，且补充一种高价值变体：**例证本身即推理链的载体，而非装饰**。另一例：伦敦
    Proms 五英镑站票（最好位置最便宜）→ 追到"艺术如何循环生长"。边界：两例均为个人旅行见闻，不能代表总体规律（条目 `counterexamples`
    已记）。'
  - '**第三位表达者（2026-09-16 补）**：陈晓卿（`corpus.podcasts.ted-chenxiaoqing-2020`，ANNOTATED，TED
    官方中文稿直读）——**投入产出比式**例证：空心挂面"当时我们拍摄张老汉的时候，他已经骨癌的晚期了"、"在全国找了六个地方，一点点地找人，前后花了一年多的时间，最后在节目里面只有七分五十六秒"，出口是导演的判断"他好像替老人过了整整一辈子"；另有饼干轶事（鱼翅／粉丝）作**自我揭发式**例证，出口是"我小心翼翼地掩盖着我的虚荣"。详档
    `corpus/annotations/ted-chenxiaoqing-2020-20260916.md`。'
  - '**第四种驱动方式·亲历者证言式（2026-09-17 第四十三批补）**：康辉《平"语"近人》第一集（`corpus.hosting.named.kanghui-201810-weizheng`，ANNOTATED，央视总台台本直读）——**例证不由主持人转述，而由当事人现场口述**：抽象主题"为民"交由梁家河时期同村人「嘉宾张卫庞」的**亲历回忆**承担（主持人只给短追问与家人式称谓："四十几年过去了，大爷，后来您和总书记又见过面吗？"→"那时候真年轻。"→"27岁。"→"2015年，他又回来了一次。"）。→
    与前述三种**驱动方式**并列的**第四种**：**证言式**——例证的**归属权在当事人**，主持人只做回声与复述（"再糙的饭他都咽得下，再穷的人他都看得起，一直都没变。"→嘉宾接"一直就没变。"）。**边界**：`scripted`
    演播室台本、副语言层未听校；本节 `boundary_conditions`「单个案例不能直接推出总体规律」**在此尤其适用**——**亲历证言不等于制度证据**（条目
    `counterexamples` 已记）。详档 `corpus/annotations/named-hosting-deepread-20260917e.md`
    §2。'
  - '**第五种驱动方式·追问清单式（2026-09-17 第五十六批补）**：马伯庸（`corpus.podcasts.ted-maboyong-2016`，ANNOTATED，TED
    官方中文稿**按双栏容器切片**逐段深读，简体单版 46 段）——**例证不承担结论，而承担"环节展开"**：设定"沙漠中发现十吨重黄金"后，把"发现→发财"拆成**十余个必须逐一处理的环节**（搬不动→借气割机→要不要说明用途→租卡车／苫布／仓库→陆运海运空运→变现须避开黑道与国家→市场波动→告不告诉家人），并**每年按汇率与新颁法规更新**。另一形态是同篇"虚构书架"的**一串具体追问**（书名／作者／封面／封底／为什么写／背后八卦）。陈晓靖（`corpus.podcasts.ted-chenxiaojing-2019`，ANNOTATED，同法深读，简体单版
    20 段）补**对照演示式**：把"得体版自我介绍"与"自曝版自我介绍"并置，**由听众自己得出**"暴露自我更亲切"。→ 与前述四种**驱动方式**并列的**第五种**：**追问清单式**——例证的价值在**可追问的环节数**，不在结论的说服力。**边界**：两例均为
    `scripted` 演讲、**副语言层未听校**；马伯庸条中的"路遥手稿背面""斯皮尔伯格读头骨"**属虚构设定内容**，引用时**必须与真实事实区分**（条目
    `counterexamples`「想象力训练不替代事实核验」在此适用）。详档 `corpus/annotations/podcasts-deepread-20260917b.md`。'
