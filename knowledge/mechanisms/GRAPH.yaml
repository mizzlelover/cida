  - '**ANNOTATED 语料样本（2026-09-16 补，此前本节点只列主持目录、无具体条目）**：①**排除误读式自我定位**——周轶君（`corpus.podcasts.ted-zhouyijun-2017`，ANNOTATED）："大家别误会，我不是说大家出国不要去买东西。我也很喜欢购物……但是我想说……"——先**否掉被误读的立场**（Concession
    First + Self-positioning），再推进判断；②**承认情感成立再给判断**——白岩松《新闻1+1》20090616（`corpus.commentary.bai-20090616-death-penalty`，ANNOTATED）："我们当然理解所有受害人家属那样的一种心情，其实枪毙一次可能都不解恨。但是再仔细一想，首先自己的亲属的生命已经失去了，而对他最大的惩罚就是让他失去生命"——先承认对方情感**完全成立**，再转向制度层判断；③**限定式异议**——王辰（`corpus.interviews.bai-20200205-wangchen-cabin`，ANNOTATED）："不是''至善之策''，却是可取之策、现实之策"——否定最高标准而不否定方案本身。'
