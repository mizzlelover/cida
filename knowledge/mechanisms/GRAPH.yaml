  - '**评论体补充样本（2026-09-16）**：《新闻1+1》20081009（`corpus.commentary.bai-20081009-nobel-science`，ANNOTATED，央视网台本直读）——**以同类现象建立共享尺度**：把"华人获诺贝尔奖"与"张德培打网球"并置，得出"所有我们去拉亲戚的时候，都是我们不太强的地方"；后续又以"日本获诺贝尔奖已有
