    轮序列（初衷→理念→安全性→确诊标准→检测→医护→容量→拐点）靠**上一轮回答中的关键词**引出下一问，正是本页 `realizations` 所记"访谈中用回答中的关键词承接下一问"；②**官方致辞·破折号引入新原则**——习近平达沃斯议程致辞（`corpus.speeches.xi-20210125-davos-agenda`，ANNOTATED）：由"世界上的问题错综复杂，解决问题的出路是维护和践行多边主义"总起，转以"——我们要坚持开放包容"等四组同构句进入原则段，**转接理由由总起句直接给出**；③**同语域·显式强调标记转接**——王毅人权理事会讲话（`corpus.speeches.wang-20240226-un-human-rights`，ANNOTATED）："在此，我要强调的是"，由四组"坚持
    X"转到对机构的规范要求；④**演讲体·先排除误读再换轨**——周轶君（`corpus.podcasts.ted-zhouyijun-2017`，ANNOTATED）："大家别误会，我不是说大家出国不要去买东西……但是我想说"，把话题从"要不要买"转到"还看什么"。'
