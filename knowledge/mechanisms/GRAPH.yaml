  - '**语料样本（2026-09-16 补，此前为 0 条）**：①**答问体**——王辰（`corpus.interviews.bai-20200205-wangchen-cabin`，ANNOTATED，央视网官方实录，12
    轮问答直读）在"拐点"问题上明确"无法预测"，并列出四项条件（底数不清、社区隔离不足、病毒变异、人员流动与天气），不确定性用于**给判断划边界**；②**演讲体**——周轶君（`corpus.podcasts.ted-zhouyijun-2017`，ANNOTATED，TED
    官方中文稿直读）开场"不知道你们会作何感想"、中段"当然你不排除……"、结尾"可能我也不至于太悲观"，不确定性用于**给对方留余地**。两位表达者、两种语域，同一机制的方向相反（划边界
    vs 留余地）。'
  - '**第三位表达者（2026-09-16 补）**：陈晓卿（`corpus.podcasts.ted-chenxiaoqing-2020`，ANNOTATED）——以"我们有没有办法来找到他们为什么会吃这种东西？它背后的原因是什么？"把异同问题**转为可研究的追问**，而非直接给结论；并以"如果展示给观众的是海面上的冰山，其实我们拥有的是……百分之九十五"标注**可见证据与不可见工作的边界**。'
  - '**第四位表达者（2026-09-16 补，样本追加，不改变 `validated` 结论）**：崔永元专访（`corpus.hosting.named.cuiyongyuan-201806-tax`，ANNOTATED）——**不确定留给事实认定层、判断留在动机层**：对"是不是她本人做的"主动给出与己方倾向相反的可能（"也有第二种情况，就是剧组……用她的名义做的"）并说"这个可能得税务局调查完了才能做出最后结论"；同一页却对动机给强判断（"我不相信她不知道"）。另以**交付方式**限定材料状态（"这种材料不能瞎传来传去"）。边界：页面为第三方媒体转载＋采访方整理的实录节选，**整理者删改程度不明**；涉及在办税务事项，本节点只论机制，**不作事实定性**。'
