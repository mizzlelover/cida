  - reader_anticipation.md
  - template_transition.md
  sources:
  - 徐赳赳《现代汉语篇章语言学》（`src.discourse.xu-jiujiu-pianzhang`，review_only；话题链与篇章组织）
  - 胡壮麟《语篇的衔接与连贯》
  - 窦文涛《锵锵三人行》话题流分析（`corpus/podcasts/` 旁注及 `corpus/hosting/` 下的 `named-douwentao-*`
    条目，分析用）
  - 鲁健重大直播与窦文涛聊天结构样本用于“自然跳转—显式回收”的对照（`corpus/hosting/`）
  - 会话分析中的序列组织研究（`knowledge/conversation/`）
  - RST 与 eRST 的关系组织参照（`src.intl.mann-thompson-rst`、`src.intl.taboada-mann-rst-review`、`src.intl.ernst-erst`，均为
    review_only；不把英文关系集当中文真值）
  - Tannen 的会话风格样本（`src.intl.tannen-conversational`，review_only；高卷入策略需按受众解释）
  - '**ANNOTATED 语料样本（2026-09-16 补，此前本节点无任何具体语料条目）**：①**变量递进（Topic Chain 收窄）**——王辰访谈（`corpus.interviews.bai-20200205-wangchen-cabin`，ANNOTATED）：12
    轮问答每轮锁定单一变量（初衷→理念→安全性→确诊标准→检测→医护→容量→拐点），**话题链由宏观逐级收窄到可回答的问题**，主线始终前景、背景压缩后置；②**命题回环（Topic
    Return）**——周轶君（`corpus.podcasts.ted-zhouyijun-2017`，ANNOTATED）：开场以《青花瓷》"视角可被转换"起，结尾回到"把那个过于庞大的自我先放在一边"，**以同一命题回到主线**。'
  - '**第三语域·娱乐聊天室（2026-09-17 第三十七批补）**：何炅做客新浪嘉宾聊天室'
  - （`corpus.hosting.named.hejiong-200508-radio`，ANNOTATED，**三页并查 13,090 汉字**）——
  - 主持人马骧开场自述"**我准备了 6 个关键词**"，页内可核**第一个《漫游》→第二个 超女→第三个 多栖
  - →第四个 PK→第五个 配音影片→末一个 收尾提醒**，每段**先念网友留言或切 UC「绝对现场」语音提问，
  - 再抛给嘉宾**。属**清单型推进（Topic Shift 的预告式切换）**：清单**提前固定**，现场只决定"何时切段"。
  - 与①"变量递进"（当场收窄 Topic Chain）、②"命题回环"（当场回收 Topic Return）**装置不同**。
  - 边界：清单由**主持人**设定、嘉宾为受访者（非何炅的主持实录）；该页**原视频语气未听校**。
  - '**顺序由提问方设定（2026-09-17 第五十八批补，样本追加，不改变 `validated` 结论）**：两条**书面定稿的媒体专访**——'
  - ①**软→硬→展望的梯度安排**：季平大使专访（`corpus.interviews.ji-20241230-madagascar`，ANNOTATED，八问八答）——
  - 问序为**软性印象 → 关系与成绩 → 峰会成果 → 中国经济 → 对方求助（电力）→ 具体合作（杂交水稻）→ 新领域（AI）→ 展望**，
  - 答方**逐题就位、不跨题预支**（成绩题只给清单、求助题才给项目与量化收益）；
  - ②**对抗性递增**：王毅"今日俄罗斯"专访（`corpus.interviews.wang-20250401-rt`，ANNOTATED，八问）——
  - 问序由**关系评价 → 合作"成功密码" → 乌克兰危机 → 俄美互动 → 中美贸易战 → 二战史 → 核裁军 → 个人印象**，
  - '**对抗性在中段（贸易战、核裁军）达峰，末问回到软性**，答方随问序**切换语体**（原则段／反击段／个人回忆段）。'
  - → 与前四例**关键差异**：此前样本的**顺序由表达者自定**（变量递进／命题回环／清单预告），
  - 本条**顺序由提问方给定**，表达者的机制是"**就位**"——**不提前、不越题、按题换体**。
  - '**边界**：两条均为**书面定稿问答**（副语言层未听校），**问序可能经双方商定**，不等于现场即兴次序。详档 `corpus/annotations/interviews-deepread-20260917.md`。'
