  - '`corpus/interviews/`、`corpus/commentary/` 与 `corpus/raw_edited_pairs/` 的结构化分析'
  - '**ANNOTATED 语料样本（2026-09-16 补，此前本节点仅有目录级说明）**：①**观察位置切换**——《新闻1+1》20090616（`corpus.commentary.bai-20090616-death-penalty`，ANNOTATED）主持人先立对方处境再问判断："当我们站在受害人家属的角度去想，你当时杀人，你想出的是不择手段，但今天让你用这种……"——把提问**放到受影响者的位置上**；②**克制共情**——王毅联合国人权理事会讲话（`corpus.speeches.wang-20240226-un-human-rights`，ANNOTATED）："本轮巴以冲突已造成近
    3 万名平民丧生，近两百万人流离失所，令人痛惜。公正平等、切实有效地保护每个民族、每个人的人权，是国际社会的共同责任。"——**事实 → 一句情绪（痛惜）→
    判断**，不铺陈不煽情；③**以意象留余地**——习近平达沃斯议程致辞（`corpus.speeches.xi-20210125-davos-agenda`，ANNOTATED）："人类经历了史上罕见的多重危机"→"寒冬阻挡不了春天的脚步，黑夜遮蔽不住黎明的曙光"→随即回到政策论证——承认严重度后给情绪余地，再回事实。'
- id: mech.empathy
  name: 共情对齐
  function: 承认读者或对话对象的处境而不牺牲判断
  file: knowledge/mechanisms/empathy.md
  related:
  - disagreement_without_distance.md
  - reader_address.md
  - softening.md
  sources:
  - src.pragmatics.he-ziran; src.conversation.hudong-lilun-fangfa; corpus/interviews/
  - '**口语样本（2026-09-16 补）**：①**答问体·具体处境**——王辰（`corpus.interviews.bai-20200205-wangchen-cabin`，ANNOTATED）：回应公众对方舱医院的担忧时，不停留于"理解大家担心"，而是**命名具体处境**（轻症患者需强度不大的治疗、需与家庭社会隔离）后说"在我看来，大家之间相互理解，这些担忧就可以解决"，共情对象具体且不放弃判断（"这不是至善之策，却是可取之策"）；②**演讲体·理解而非认同**——周轶君（`corpus.podcasts.ted-zhouyijun-2017`，ANNOTATED）：与英国朋友就博物馆藏品来源激烈争论后，"并没有跟这个朋友绝交，我反而是试图去理解他为什么这么来看"——**把理解与认同分开**，正合本节
    boundary_conditions「共情不能替代责任追究」的反面用法：先追究（"那不是抢来的吗"）再理解。'
  - '**评论体补充样本（2026-09-16）**：《新闻1+1》20090616（`corpus.commentary.bai-20090616-death-penalty`，ANNOTATED，央视网实录直读）——主持人在第三轮**主动切换到受害者家属视角**发问（"当他一下子杀害了
    8 个人的时候，当我们站在受害人家属的角度去想……"），观察员先承认"我们当然理解所有受害人家属那样的一种心情，其实枪毙一次可能都不解恨"，再回到判断（"对他最大的惩罚就是让他失去生命，那么这一点法律已经给你公正"）。这是
    `empathy` 与 `concession` 的组合：**承认对方的情绪为真，同时不放弃法律判断**，正合本节「不牺牲判断」。'
- id: mech.emphasis
  name: 强调
  function: 把读者必须记住的部分从信息平面托起
  file: knowledge/mechanisms/emphasis.md
  related:
  - rhetorical_peak.md
  - rhythm.md
  - summary.md
  - listicle_tendency.md
  sources:
  - src.rhetoric.chen-wangdao-fafan; src.hosting.zhongguo-boyinxue; corpus/hosting/
  - '**口语样本（2026-09-16 补）**：①**短句重复式**——《新闻1+1》20130730（`corpus.hosting.named.baiyansong-20130730-violence`，ANNOTATED）："暴力就是暴力，犯罪就是犯罪，在这一块不能有这种任何的妥协"，以同构短句重复把界限句从信息平面托起，前后均为普通陈述（形成峰—平对比）；②**关键词指认式**——周轶君（`corpus.podcasts.ted-zhouyijun-2017`，ANNOTATED）：指出中国游客搜索欧洲各国时"高度重合、非常频密"的关键词只有一个——"买什么便宜"，用**单一关键词**承担全段质询。两例均未整篇提高音量（符合
    overuse_risk 警告）；副语言重音层需听校，本样本只支撑文字层强调手段。'
  - '**"小标题格式"作分段与强调装置（2026-09-17 第六十四批补，样本追加，不改变 `validated` 结论）**：'
  - 两条官方定稿致辞给出**两种相反做法**——①**同篇多组枚举、刻意换格式**：陈晓东·博鳌亚洲论坛 2024
  - （`corpus.speeches.chen-20240328-global-security`，ANNOTATED，**正文约 3,696 汉字**）同篇三组并列，
  - 小标题格式**互不重复**——三点特征用「**四字＋四字**」（"立正道、行大义"）、四点"成功密码"用「**以X为Y**」
  - （"以共同安全为宗旨"）、五点建议用「**破折号＋动宾对句**」（"——加强理念融通，深化维护共同安全的国际共识"）；
  - ②**单组枚举、格式统一**：刘彬·人工智能全球治理高级别会议 2026（`corpus.speeches.liu-20260718-ai-governance`，
  - ANNOTATED，**正文约 1,101 汉字**）四点统一用「**动宾短语＋是＋定位名词**」
  - （"坚持开放共赢**是重要基础**""确保安全可控**是根本前提**""促进文明互鉴**是努力目标**""倡导和衷共济**是实现路径**"），
  - 四个定位名词构成**四层递进**。
  - → 两条共同说明：**小标题格式本身可承担"分段＋强调"**，**变与不变都成立**，
  - 判据是"**读者能否靠格式辨认分段**"；**本节点新增边界**：格式反复使用即滑向
  - '`../anti_patterns/structural_monotony.md`（等长同构），故"统一"须以**定位名词有递进**为前提，'
  - '"变化"须以**每组内部仍自洽**为前提。**边界**：两条均为 `prepared` 审定文本、**副语言层未听校**。'
  - 详档 `corpus/annotations/speeches-deepread-20260917c.md`。
