  - '**ANNOTATED 语料样本（2026-09-16 补，此前本节点无具体条目）**：①**博客体·白话重讲专业内容**——刘未鹏《快排为什么那么快》（`corpus.blogs.mindhacks-quicksort-so-quick`，ANNOTATED）：**Anchor**＝"我们先来玩一个猜数字游戏"；**Single
    Step**＝二分；**Layering**＝先给"策略是平衡的"这一近似，再给"信息论并不是因，而是果"的精确化；**Check-in**＝"说到这里，剩下的事情就实在很简单了"；**Landing**＝基排"理顺一副牌"的实例。作者并明示定位："这篇文章相当于
    MacKay 原文的白话文版……我用大白话解释了一通"；②**答问体·定义式解释并纠偏**——王辰（`corpus.interviews.bai-20200205-wangchen-cabin`，ANNOTATED）：以"临床诊断病例，**也就是**在流行病学史和临床表现上和确诊病例高度吻合"给出定义式解释；再以"并非所有患病者都能检出核酸阳性"（检出率约
    30%–50%）修正读者对检测的既有预期，随后落地建议。'
- id: mech.humor
  name: 幽默
  function: 以低威胁的错位、轻松或自嘲降低防御并打开理解入口
  file: knowledge/mechanisms/humor.md
  related:
  - audience_design.md
  - empathy.md
  - emotional_distance.md
  - rhetorical_peak.md
  sources:
  - '`src.hosting.fangtan-zhuchi`; `src.intl.tannen-conversational`; `src.intl.goffman-interaction`;
    `src.intl.aristotle-rhetoric`'
  - '`corpus/hosting/` 与 `corpus/interviews/` 的结构化分析'
  - '**ANNOTATED 语料样本（2026-09-16 补，仅 1 位表达者）**：刘未鹏《快排为什么那么快》（`corpus.blogs.mindhacks-quicksort-so-quick`，ANNOTATED）——①**自嘲式降压**：把作者与读者放在同一"土鳖"位置上（"所以说，土鳖也有土鳖的幸福:P"），在讲完信息论视角之后松弛一次再收束；②**字形／谐音玩笑**："高爷爷真不愧是姓高的，囧rz.."把对
    Knuth 的敬意做成字形玩笑。两处均在**概念已清晰解释之后**出现，且之后仍有判断落点，符合本页 `mechanism`「短暂松弛→回到事实或判断」与
    `repair_strategy`。'
  - '**评估状态（2026-09-16 初判，同日已补足并升级）**：初判时本节点**语料样本仅 1 位表达者**（刘未鹏），不满足 §121 第二分支；同日深读陈晓卿条后补足第
    2 位表达者，**已升级**（见下条与「跨来源验证」）。'
  - '**第二位表达者（2026-09-16 补）**：陈晓卿 TED《世上最美味的食物，背后有什么秘密？》（`corpus.podcasts.ted-chenxiaoqing-2020`，ANNOTATED；据其精读标注档
    `corpus/annotations/ted-chenxiaoqing-2020-20260916.md`，证据为 TED 官方中文稿全文直读）——①**自嘲开场**："几乎我是不配拥有姓名的"→被成都食客认出后自问"难道成都不配拥有姓名吗？"；②**比喻自设反驳**："要和你的食物谈一个恋爱"后立刻借导演之口反问"难道我们是章鱼，是螳螂，是黑寡妇蜘蛛吗？"，把比喻的荒谬边界显式摊开。'
  - '**边界正例（重要，2026-09-16 补）**：**同一篇**中涉及第三人（张爷爷）病故处**不设笑点**，笑点只落在**自我与自身价值判断**上——标注档明记鱼翅轶事的出口"不是笑话，而是对自己的价值判断的揭发"。这可作
    `boundary_conditions`（悲剧／权力不对等场合优先保护当事人）的**正例**，并印证 `repair_strategy`「笑点之后仍须有事实、限定或行动落点」。'
  - '**第三位表达者（2026-09-16 补，样本追加，不改变 `validated` 结论）**：崔永元专访（`corpus.hosting.named.cuiyongyuan-201806-tax`，ANNOTATED）——**自嘲式幽默**：先把"高尚动机"的便宜话反手摊开（"他们有人说我一开始就是这么想的，要不是你们来采访我就认了……（笑）咱不说瞎话，真的没这个想法"），再给平凡真实动机（"一开始就是一个当爹的愤怒"）。错位依旧**落在作者自身**，与刘未鹏、陈晓卿同向。边界：页面为第三方媒体转载＋采访方整理的实录节选，整理者删改程度不明；涉及在世个人争议事件，**引用最小化**，不作一般写作范例。'
  - '**第四位表达者（2026-09-17 第五十六批补，样本追加，不改变 `validated` 结论）**：陈晓靖《脱口秀的残忍和治愈》（`corpus.podcasts.ted-chenxiaojing-2019`，ANNOTATED，TED
    官方中文稿**按双栏容器切片**逐段深读，简体单版 20 段）——①**自我拆台**：引《还珠格格》台词"一个破碎的我如何拯救一个破碎的你"后**立刻自评**"这句话真的好做作，但是我好喜欢"，把可能滑向抒情的引用当场拉回；②**自曝式自嘲**："我这个人又穷又懒又自闭，我也知道，但是我又不想改，我最近脱发还有点严重"（对照"得体版自我介绍"演示"暴露自我更亲切"）；③**自嘲式归因**：把海选通过归因于"莫名其妙的自信，还有我爸做的那些荒唐事"，并落到"我进入这一行，真的就是拼爹"。错位同样**只落在自身**；并**主动拒绝体裁外的期待**（观众要"干货和价值观"→"你要这些去看TED啊，脱口秀不是什么讲道理的地方"）。**边界**：`scripted`
    台本、**副语言层未听校**；讲者自陈"对技巧的掌握程度……不稳定"，**不可当方法论提炼**；涉整容等个人隐私的自曝**引用时不得娱乐化他人隐私**（与本节
    `boundary_conditions` 同向）。详档 `corpus/annotations/podcasts-deepread-20260917b.md`。'
- id: mech.information_density
  name: 信息密度
  function: 控制单位阅读努力中真正抵达的判断与证据
  file: knowledge/mechanisms/information_density.md
  related:
  - compression.md
  - rhythm.md
  - explanation.md
  sources:
  - '**官方致辞样本（2026-09-16 补）**：习近平达沃斯议程特别致辞（`corpus.speeches.xi-20210125-davos-agenda`，ANNOTATED）——**分段举证分工**：原则段（"四大课题"与四组"坚持
    X／不搞 Y"）**零数字**，只用价值词与经典引语（"法者，治之端也"）；行动段（"中国将继续…"五段）密集给数字与年份（150 多个国家、13 个国际组织、36
    个医疗专家组、2030／2060）。密度**按段落功能分配**，不是全篇摊平。'
  - '**同语域第二篇（2026-09-16 补）**：王毅联合国人权理事会讲话（`corpus.speeches.wang-20240226-un-human-rights`，ANNOTATED）——**原则段只给一个事实**（本轮巴以冲突"近
    3 万名平民丧生，近两百万人流离失所"），**自述段密集给数字与体系名**（14 亿多人口、教育／社会保障／医疗卫生三大体系）。与达沃斯篇"原则段零数字／行动段密集数字"同向，且更收紧：**原则段只保留一个最有冲击力的事实**。'
  - src.writing.qishier-tang; src.rhetoric.wang-xijie-tonglun; corpus/blogs/
  - '**口语样本（2026-09-16 补）**：周轶君（`corpus.podcasts.ted-zhouyijun-2017`，ANNOTATED）——消费质询段连续给出**三组功能不同的数据**：①行为占比（中国游客海外时间
    80% 以上用于购物）；②搜索动机（墨卡托基金会报告：跨国高重合关键词为"买什么便宜"）；③行为落差（某欧洲品牌中国游客占其巴黎门店消费人数 10%，而参观其艺术中心者仅
    1%）。三组各承担不同承重功能（现象／动机／落差），**不是同一事实的堆叠**，符合本节「区分承重成分、关系成分和噪声」。边界：本节 overuse_risk
    警告"追求密度会删掉证据和人际功能"——该段保留了一句换气（"大家别误会……"）作为人际功能，可作正例参照。数据本身的真实性需独立核验（条目 `weaknesses`
    已记）。'
  - '**评论语域补样（2026-09-16 补，样本追加，不改变 `validated` 结论）**：①《新闻1+1》20190421「袁府」——**时间线即论证**（2017
    年办三证 vs 2018-12 省政府批准土地用途改变），亩数按三类分项（坑塘 30.94／建筑 12.54／绿化 10.75），数字**各指不同事实**；②《新闻1+1》20081209——276
    人（清理规模）／4.7 万元（金额）／64,900 篇（普遍性）**三组不重复**；③崔永元专访（`corpus.hosting.named.cuiyongyuan-201806-tax`，ANNOTATED）——4200／4500
    万→3000 多万→7000 多万→7 亿多→5 个多亿构成**递推链条**，每组数字推进一级判断。边界：三例数字均为**当事方或节目方自述**，本节点只论密度设计，**不为其真实性背书**。'
  - '**媒体专访语域补样（2026-09-17 第五十八批补，样本追加，不改变 `validated` 结论）**：两条外交部全文直读的**书面定稿专访**——①**分段举证分工**：王毅接受"今日俄罗斯"专访（`corpus.interviews.wang-20250401-rt`，ANNOTATED，34
    段／约 4,850 汉字）**原则段零数字**（"三大特质"只给四字对句与条约名），**成绩段密集给项目与年份**（"从当年苏联援华的 **156 项**重点工程到今天的
    **2448 亿美元**贸易额"），**反击段改用比喻与成语**（"钥匙是在自己手里，不在别人的口袋"）；②**每答给可核验项**：季平大使专访（`corpus.interviews.ji-20241230-madagascar`，ANNOTATED，26
    段／约 2,640 汉字）八问八答**每答都落至少一个可核验项**（连续第 **9** 年第一大贸易伙伴／水电站 **64 兆瓦**／GDP **4.8%**／高技术制造业
    **9.1%**／医疗队累计接诊近 **500 万**名患者／获勋章 **121** 枚）。→ 与前述样本同向：**密度按段落功能分配**（原则段／反击段低密度，成绩段高密度），**且答问体里"每答给一项可核验项"是可复用的下限规则**。**边界**：两条均为**书面定稿**（副语言层未听校）；所给数字与项目**均为发布方自述**，本节点只论密度设计，**不为其真实性背书**。详档
    `corpus/annotations/interviews-deepread-20260917.md`。'
- id: mech.irony
  name: 反讽
  function: 借表层话语与语境之间的张力暴露矛盾，但不让读者误认作者立场
  file: knowledge/mechanisms/irony.md
  related:
  - contrast.md
  - disagreement_without_distance.md
  - stance_system.md
  - confidence.md
  sources:
  - '`src.rhetoric.wang-xijie-tonglun`; `src.intl.goffman-interaction`'
  - '`corpus/contrast/` 与 `corpus/commentary/` 的结构化分析'
  - '**ANNOTATED 语料样本（2026-09-16 补；此前本节点为"2 个来源 + 0 条语料样本"）**：'
  - 1. `corpus.commentary.bai-20190421-yuanfu`（白岩松，评论语域）——"要是真建这样的一个养老院……
  - 那真有点感动中国的意思了"→"但就怕不是"；详档 `corpus/annotations/bai-20190421-yuanfu-20260916.md`；
  - 2. `corpus.commentary.bai-20081209-civil-service-parttime`（白岩松，评论语域）——标题立意段
  - '"要么你无私……要么就是无畏"与地方鼓励兼职处的反问"当雷锋去呀？……你觉得会吗？"；'
  - 详档 `corpus/annotations/bai-20081209-civil-service-parttime-20260916.md`；
  - 3. `corpus.hosting.named.cuiyongyuan-201806-tax`（崔永元，访谈语域）——"对，说得特别对，就是……
  - 我不公报私仇我还给谁报仇啊？"（**计入**）；同条末尾所引微博"原以为是反思喝闷酒。实际上是怕
  - 股票跌"（同表达者**补强例**，媒体转载、原页未核验）；
  - 详档 `corpus/annotations/cuiyongyuan-201806-tax-20260916.md`。
  - '**弱例登记（不计入门槛，只记形态）**：王锡锌（同第 2 条节目）"非常有意思的是，法律中却没有'
  - 针对这一违规行为的法律责任追究条款"——具备显式反讽标记＋禁则/罚则落差，但**回扣由后续直陈承担**，
  - 未形成独立可见的回扣句，故不据此主张专家语域的完整样本。
  - '**仍不采用（判据已写清）**：`bai-20090616-death-penalty`"恨不得枪毙两次、三次"——'
  - 属**转述他人心理**并随即给出明确判断，**表层命题未被维持、无回扣句**；
  - '`bai-20081009-nobel-science`"所有我们去拉亲戚的时候，都是我们不太强的地方"——落差已由同段事实直接说明，'
  - 已归入 `contrast`，不重复计为反讽；刘未鹏"土鳖也有土鳖的幸福"与陈晓卿"难道我们是章鱼、螳螂、
  - 黑寡妇蜘蛛吗"——**自嘲式幽默**（已计入 `humor`），靶子指向作者自己，无"表层命题 vs 现实证据"张力。
- id: mech.metaphor_analogy
  name: 比喻与类比
  function: 用熟悉的事物降低陌生事物的理解成本
  file: knowledge/mechanisms/metaphor_analogy.md
  related:
  - explanation.md
  - rhetorical_peak.md
  - abstract_inflation.md
  sources:
  - '**官方致辞样本（2026-09-16 补）**：习近平达沃斯议程特别致辞（`corpus.speeches.xi-20210125-davos-agenda`，ANNOTATED，外交部官网全文直读）——三种形态：①**意象承担信心判断**（"寒冬阻挡不了春天的脚步，黑夜遮蔽不住黎明的曙光"，判断不给论证成本）；②**常识类比承载制度判断**（"没有两片完全相同的树叶"→制度差异是文明内在属性）；③**成对隐喻界定竞争观**（"田径赛"对"角斗赛"）。详档
    `corpus/annotations/xi-20210125-davos-agenda-20260916.md`。'
  - '**同语域第二篇（2026-09-16 补）**：王毅联合国人权理事会第 55 届会议讲话（`corpus.speeches.wang-20240226-un-human-rights`，ANNOTATED）——④**日常物象承载团结主张**（"56
    个民族像石榴籽一样紧紧抱在一起"）；⑤**成对隐喻界定机构角色**（应成为各方交流合作的"平台"，而不是搞集团政治的"战场"）。'
  - '**同语域两条（2026-09-17 补）**：郝广才（`corpus.podcasts.ted-haoguangtsai-2015`，ANNOTATED）——'
  - '**喻体复现且功能递进**（"翅膀"→"裹小脚"→纪伯伦"弓与箭"），并给出**含贬损的对照**'
  - （"老鹰的翅膀是用来飞的，鸡的翅膀是用来烤的"）作为 `overuse_risks` 的真实反例；
  - 黄执中（`corpus.podcasts.ted-2017-debate-thinking`，ANNOTATED）——以"水瓶"与"龙舟写生"
  - 两个视觉喻体承担"观点≠知识点"，并在故事后**反推喻体来源**以限制过度解读。
  - 详档 `corpus/annotations/podcasts-deepread-20260917.md`。
  - 陈望道《修辞学发凡》（譬喻格的类型与适用）
  - George Lakoff 概念隐喻研究（`src.intl.lakoff-metaphors`，review_only；补强比喻的认知功能）
  - 刘未鹏《Mind Hacks》类比写作分析（`corpus/blogs/`，分析用）
  - '**口语样本（2026-09-16 补，此前仅书面分析）**：王辰（`corpus.interviews.bai-20200205-wangchen-cabin`，ANNOTATED，央视网官方实录直读）——比喻在答问现场**随即被条件兑现**：说方舱医院是"**诺亚方舟上的一个舱位**"，紧接资源、速度、收治层级三项条件（"用最小的社会资源、最简单的场所的改动……形成一个有序的层级"）；又称方舱为轻症患者的"**社区**"，随即以确诊标准与排除条件把它落回制度含义。周轶君（`corpus.podcasts.ted-zhouyijun-2017`，ANNOTATED）提供**否定式比喻**："外面的世界不仅仅是一个非常大的免税商店"——用否定喻体划出认知边界而非描述对象。两例都过三功能检验（解释型／锚定型），且"比喻之后回到本体"（本节操作规范第
    4 条）；边界：比喻不承担证据功能，条件与制度才是证据。'
  - '**第三位表达者（2026-09-16 补）**：陈晓卿（`corpus.podcasts.ted-chenxiaoqing-2020`，ANNOTATED，TED
    官方中文稿直读）——三种用法：①**比例锚定**："如果我们展示给观众的是海面上的冰山，其实我们拥有的……百分之九十五"（把不可见工作量锚成比例）；②**概念锚定**："味觉信息茧房"；③**比喻后自设反驳**："要和你的食物谈一个恋爱"→借导演之口反问"难道我们是章鱼，是螳螂，是黑寡妇蜘蛛吗？"——**喻体在被使用时即被检视**，是本节"反装饰"的高价值正例。'
  - '**第四位表达者（2026-09-16 补，样本追加，不改变 `validated` 结论）**：《新闻1+1》20081209（`corpus.commentary.bai-20081209-civil-service-parttime`，ANNOTATED）——**以喻体承担制度判断**：①专家连线称"禁令成了**看守麦田的稻草人**"（有禁令、无威慑）；②评论员以**体育规则**解释"禁则须配罚则"（"就像黄牌，累计几张黄牌，你就停赛一场，红牌你立即就得出去……可是你现在没有红牌和黄牌，人家就踢呗"）。两例均属**解释型**，且比喻之后回到制度判断，未让比喻独立承担结论。边界：专家段为连线答问、评论段为台本；该条旧站第
    3 页不可得（结尾段未核验）。'
  - '**第五位表达者与危机语域补样（2026-09-17 第三十二批补，样本追加，不改变 `validated` 结论）**：'
  - ①李强·达沃斯 2024（`corpus.speeches.li-20240116-davos`，ANNOTATED，外交部官网全文直读）——
  - '**全景视角类比**承担方法（"想要领略阿尔卑斯山雄浑壮阔之美，一定要把视野放宽、把目光投远一些"→'
  - '"看待中国经济也同样如此"），**结构喻**承担解释（产业链供应链是"血管系统"，干扰会形成"梗阻""断点"），'
  - 均属**解释型**且类比后立即回到本体（合作或政策行动）；
  - ②王毅·安理会 2023（`corpus.speeches.wang-20231129-unsc-gaza`，ANNOTATED）——**危机语域的意象密度更高**
  - （"加沙地带没有防火墙"、"很可能演变为吞噬整个地区的浩劫"、"站在战与和的十字路口"），
  - 但**每处意象之前都先给事实或条款**（决议号、人道通道、反对集体惩罚与强制迁移），
  - 即"比喻不承担举证责任"。两例共同印证本节操作规范第 4 条（比喻是桥，不是家）；
  - 边界：两条均为 `prepared` 宣读稿，**不构成即兴比喻证据**；本批未改动任何 `confidence`。
  - '**评论语域补样（2026-09-17 第三十三批补，样本追加，不改变 `validated` 结论）**：'
  - 《新闻1+1》20120831（`corpus.commentary.bai-20120831-news-1plus1-watch`，ANNOTATED，
  - 央视网全文 200／汉字 6,546）——**交通意象承担事件叙述**：以"他的笑**撞上了**网友愤怒的车头"
  - 把"现场表情→网友质疑→名表追问"的传播链串成一条**连续剧**（"这部剧…到今天都有最新的情节"），
  - 但**每条判断随后都给事实**（车祸时间与遇难人数、微博 13 条问答、网友列举的第七至第十块表、
  - 纪委调查表态）。属§操作规范第 4 条"比喻是桥不是家"的**又好又易被误用**的样本：
  - 意象只负责串场，**证据仍由事实承担**；边界：该条为电视评论台本，含解说与连线，
  - '**不构成即兴比喻证据**，且原视频语气未听校。'
