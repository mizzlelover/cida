  - '**语料样本（2026-09-16 补，此前为 0 条）**：①**演讲体**——周轶君（`corpus.podcasts.ted-zhouyijun-2017`，ANNOTATED）：收束处"更多的希望我觉得是在在座的每一位"，**把结论显式转交给听众**，而非号召式升华；②**电子媒体**——《新闻1+1》20130730（`corpus.hosting.named.baiyansong-20130730-violence`，ANNOTATED）：以"我们每个人的安全"框定受众，并把公安（执行层）与学者（归因层）分设两条连线，**按受众角色分配证据职责**。两例均为口语语域。'
  - '**第三位表达者（2026-09-16 补）**：陈晓卿（`corpus.podcasts.ted-chenxiaoqing-2020`，ANNOTATED，TED
    官方中文稿直读）——①**显式指定两种接受方式**："我们希望大家能够把我们的片子不仅当作品看，也可以当娱乐消遣的产品来看"；②**以受众身份自认收束**：引古兹曼"一个国家没有纪录片，就像一个家庭没有相册一样"后说"我们的工作就是为中国美好的食物做一个非常精致、沉甸甸的相册"。两处均**不假设单一受众**，符合本节
    boundary_conditions。'
  - '**第四位表达者·娱乐聊天室（2026-09-17 第三十七批补）**：何炅做客新浪嘉宾聊天室'
  - （`corpus.hosting.named.hejiong-200508-radio`，ANNOTATED，**三页并查 13,090 汉字**，何炅为**受访嘉宾**）——
  - 被问"会不会改变主持风格"时答"**不是改变主持风格，会根据节目新的内容来调整我的状态**"，
  - 并**按节目形态分说参数**：外景"要更加的积极和主动一点……**对局面的控制要多一些**"；
  - 明星访谈则要"**之前做很多案头的工作**，理清楚头绪，**分析清楚观众想听的是什么**"。
  - → **作用点＝节目形态即受众参数**（形态一变，准备度、控制强度与受众预期假设同时变），
  - 与本页 mechanism"先识别受众知识与反对点，再调十维 Profile"同向。
  - 边界：该条为**嘉宾自述**（非其主持实录），且**原视频语气未听校**。
  - '**第五位表达者·文化节目主持（2026-09-17 第四十四批补）**：康辉《平"语"近人》**第二集**（`corpus.hosting.named.kanghui-201810-zhiguo`，ANNOTATED）'
  - 与**第九集**（`corpus.hosting.named.kanghui-201810-liyou`，ANNOTATED）——**两种"把观众纳入话轮"的新形态**：
  - ①**主持人自嘲式拉平**（第二集）：向现场同学发问后，观众答错（"我记得这句话应该是唐太宗李世民说的"），
  - 主持人先自曝同类错误——"**其实你的水平跟我差不多。**当时我被问到这个问题的时候，我的回答也是……"——
  - '**再**把正确答案交给释义人。→ 作用点在**降低发言成本**：先把自己降到与受众同一水平，**不俯视**。'
  - ②**把选答者的权力交给观众**（第九集）：观众提问后，主持人问"**这个问题你希望哪位老师回答你？**"→ 观众"**想让赵老师。**"
  - → 由被点名者作答。→ 作用点在**问答调度权的转移**：受众不只被邀请提问，还能**指定由谁回答**。
  - → 两例与既有样本的关系：**追加"参与方式的设计"这一作用点**（前四例分别在收束／框定分工／接受方式／节目形态），
  - 本节 mechanism 不变。边界：两条均 `scripted` 台本、**副语言层未听校**；
  - '**"自嘲式拉平"不得滑向回避正答**（条目 `overuse_risks` 已记），**"观众选答者"不保证回答质量**（条目 `counterexamples`
    已记）；'
  - 详档 `corpus/annotations/named-hosting-deepread-20260917g.md` §2、§4。
  - '**"问题来源交给受众"（2026-09-17 第六十三批补，样本追加，不改变 `validated` 结论）**：两条政务门户**在线访谈**——'
  - ①广德市医保局（`corpus.interviews.guangde-20231213-medical-insurance`，ANNOTATED，**实录正文约
    2,387 汉字**）：
  - 主持人在开场**先自报职务、用跨省流动人口数据切入、再把嘉宾职务全称介绍完**，最后一句"**请广大网友就自己关心的
  - 医保问题踊跃提问**"——**把议程交给受众**；答方**按职能分工就位**（副局长答政策待遇、办公室主任答办事流程），
  - '**不越题**；②深圳市医保局（`corpus.interviews.shenzhen-20231030-medical-insurance`，ANNOTATED，'
  - '**实录正文约 2,445 汉字**）：**11 位具名网友昵称**各自设问，单一嘉宾**逐条就位作答**。'
  - → 与前五例的关系：前五例的作用点在**收束／框定分工／接受方式／节目形态／参与方式**，
  - 本条**追加"问题来源"这一作用点**——受众不只被框定、被邀请，**还能自设议题**（具名或由主持代问）。
  - '**边界**：两条均为**官方书面实录**（副语言层不可得），**问题可能经主办方筛选或编辑**，'
  - 故"受众自设议题"**只指实录呈现的提问来源**，**不等于**议题完全由网民决定；本节 mechanism 不变。
- id: mech.clarification
