- id: mech.turn_projection
  name: 话轮预示
  function: 让听者预期下一步并降低跟随成本
  file: knowledge/mechanisms/turn_projection.md
  related:
  - reader_anticipation.md
  - discourse_markers.md
  - rhythm.md
  sources:
  - src.conversation.hudong-lilun-fangfa; src.hosting.zhongguo-boyinxue; src.intl.sacks-schegloff-jefferson-turntaking;
    src.intl.stivers-turntaking; corpus/podcasts/
  - '`src.conversation.wangxuanting-nihai-bieshuo` 王璇婷《言语类话语标记"你还别说"探究》（full_text，2026-09-11
    全文实读）："你还别说"的语篇功能=话轮开启（38% 位于语篇开头）与话轮延续（62% 位于语篇中间，连接前项与后项）——话轮操作语的中文个案；BCC 语料频次为语篇位置分布提供量化参照。'
  - '`src.conversation.lihongyu-huashizheme`（full_text，2026-09-12）："话是这么说"'
  - 的话轮转接功能——话语标记作为让步式接题装置，先承认对方话轮再推进己方话轮，
  - 为话轮投影的"承接—转折"实现提供小句习语化变体。
