    全文实读）：话语标记化是**语用化**而非词汇化/语法化——话语标记的判定标准是话语功能（程序义/元语用）而非词类归属；"功能四问"的历史语言学理论根基。'
  - '`src.conversation.wangxuanting-nihai-bieshuo` 王璇婷《言语类话语标记"你还别说"探究》（**full_text**，2024，2026-09-11
    全文实读）："你还别说"=话语标记化的"别说"变体（焦点重音位移+程序义+句法独立+元语用）；人际功能三分：提醒/表达立场/**预设-反预期**（与说话人、听话人、言语社会共享预期相反三型）；语篇位置开头
    38%/中间 62%。转引线索：董秀芳 2007"别说"三分（状中短语/连词/话语标记）、刘丽艳 2005 界定四标准（未读原文，仅作线索）。'
  - '`src.conversation.yangguoping-wanle-yuyonghua` 杨国萍等《话语标记语"完了"的语用化》（review_only，摘要级，2026-09-11
    取得摘要）：语用化=高频使用中的结构脱落+语境义内化；焦点转移路径"动作完结义→事件完结义→话语组织/情感态度标记"。摘要级不外推。'
  - '`src.conversation.lihongyu-huashizheme` 李宏宇《话语标记"话是这么说"语用功能探析》'
  - （full_text，2026-09-12 全文实读）：小句习语化为话语标记的功能四项（话轮转接/
