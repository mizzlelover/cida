  - '`src.conversation.wangxuanting-nihai-bieshuo` 王璇婷《言语类话语标记"你还别说"探究》（full_text，2026-09-11
    全文实读）："你还别说"的语篇功能=话轮开启（38% 位于语篇开头）与话轮延续（62% 位于语篇中间，连接前项与后项）——话轮操作语的中文个案；BCC 语料频次为语篇位置分布提供量化参照。'
  - '`src.conversation.lihongyu-huashizheme`（full_text，2026-09-12）："话是这么说"'
  - 的话轮转接功能——话语标记作为让步式接题装置，先承认对方话轮再推进己方话轮，
  - 为话轮投影的"承接—转折"实现提供小句习语化变体。
  - '`src.conversation.yinhailiang-2009-bieshuo` 尹海良《自然口语中的话语标记"别说"》'
  - （review_only，摘要级，2026-09-16 取得摘要）：话语标记"别说"常出现在**话轮开头或
  - 中间**，其"引发-阐释"功能即开新话轮并预告后续阐释——为"标记位置可投影下一话轮
  - 功能"补中文原生证据；与王璇婷"你还别说"的开头/中段分布（38%／62%）互证。
  - '`src.conversation.ouzhitong-2024-jiushi-rentong`（**full_text**，2026-09-16，supplementary）：'
  - 认同标记"就是"的**话轮位置四分布**（120 例：独立充当话轮 58% 最多、话轮之首 35%）与
  - '"**不用于对话开始**、总在一定话轮之后"的规律；其"转换话轮／保持话轮"两功能分别对应'
  - 本节"接题"与"守题"两种投影。
  - '`src.conversation.lixinyue-2024-jiushi-yihuan`（**full_text**，2026-09-16，supplementary）：'
  - 机构会话中"就是(说)"的形式连贯三式——**引发话轮／转接话轮／占据话轮**，为"标记位置可
  - 投影下一话轮功能"补**机构语域（医患）**证据，与尹海良 2009（日常口语）、王璇婷
  - '"你还别说"形成三语域分布对照。'
  - '**访谈语域样本（2026-09-16 补）**：白岩松专访王辰（`corpus.interviews.bai-20200205-wangchen-cabin`，ANNOTATED，12
    轮问答直读）——主持人以**问尾并列两问**锁定答复范围（"提出''方舱医院''的初衷是什么？能发挥多大作用？""如何做到确诊''快而准确''？如何避免疑似病例进入方舱医院？"），受访者据此逐项兑现而不跑题。这是本节
    realizations 所记"访谈用问题尾部锁定答复范围"的实例证据；其预期管理对象是**受访者**而非读者，与文章用标题／语义桥管理读者预期属不同对象，不可混用。'
  - '**访谈主持侧三形态（2026-09-17 第三十六批补，样本追加，不改变 `validated` 结论）**：王志·央视《面对面》'
  - 专访易中天（`corpus.hosting.named.wangzhi-200608-yizhongtian`，ANNOTATED，**两页并查约 10,030
    汉字**）——
  - ①**最短追问**：嘉宾答"我根本不知道它在怎么变"后，主持人只问"怎么说？"（三字），**不给选项、不预设答案**；
  - ②**嘉宾反问时换侧面**：嘉宾反问"这难道就是当今老百姓关心的事吗？不会吧"后，主持人改提
  - '"可能跟我们平常心目中的学者形象有很大的一个反差"——**不重复原问、换一个可回答的侧面**；'
  - ③**以"把回避命名"收束**：篇末"如果问一句为什么呢？"／"没有为什么。"／"为什么不呢？"／"为什么要呢？"…
  - '"但是你不愿意把答案告诉我们。"——**把对方的回避行为本身作为收束点并公开留白**。'
  - 与本节既有"问尾并列两问锁定答复范围"合看，同一语域内共**四种投影装置**；
  - 边界：该页说话人标签作「记者：」（节目实录惯例），**原视频语气未听校**。
- id: mech.uncertainty
  name: 不确定性标注
  function: 让证据边界和未知部分可见
  file: knowledge/mechanisms/uncertainty.md
  related:
  - stance_system.md
  - softening.md
