  - '**官方致辞样本（2026-09-16 补）**：同条达沃斯致辞——**受众切换段落**：先以"四大课题"与多边主义原则面向国际参与者立共同框架，再以五段"中国将继续…"切换为**自我承诺**，回应听者未说出口的"你们会怎么做"；收束把行动交回"同舟共济、团结合作"。'
  - '**同语域第二篇（2026-09-16 补）**：王毅联合国人权理事会讲话——**三段受众切换**：国际会场（"全人类的共同事业"）→ 国内自述（脱贫与三大体系）→
    再回国际（"作为负责任大国"与中国承诺收束）。与达沃斯篇"全球原则 → 自我承诺"同向，但多一次折返。'
